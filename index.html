<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Field data portal</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FFFFFF">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Field">
<meta name="robots" content="noindex, nofollow">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">

<style>
:root{--paper:#F4F6F1;--card:#fff;--ink:#17231E;--muted:#6B7872;--line:#E3E8E1;--fill:#EFF2EC;--accent:#D9480F;--ok:#2E7D4F;--warn:#B7791F;--bad:#B3261E;
 --sat:env(safe-area-inset-top,0px);--sab:env(safe-area-inset-bottom,0px);--sal:env(safe-area-inset-left,0px);--sar:env(safe-area-inset-right,0px);
 --shadow:0 1px 2px rgba(23,35,30,.05),0 6px 20px rgba(23,35,30,.05)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--paper);overscroll-behavior:none}
body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;font-size:16px;line-height:1.4;color:var(--ink);-webkit-text-size-adjust:100%}
#gfp{position:fixed;inset:0;display:flex;flex-direction:column;background:var(--paper);max-width:760px;margin:0 auto}
h1,h2,h3,p{margin:0}
button,input,select,textarea{font:inherit;color:inherit;margin:0;max-width:100%}
button{cursor:pointer;touch-action:manipulation}
.hdr{flex:0 0 auto;background:#fff;display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--line);padding:calc(8px + var(--sat)) calc(14px + var(--sar)) 8px calc(14px + var(--sal))}
.hl{flex:1;min-width:0}.lab{font-size:11px;color:var(--muted)}.proj{font-weight:700;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stn{background:var(--ink);color:#fff;border:0;border-radius:999px;padding:7px 14px;font-weight:700;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:15px;min-height:38px}
.hr{display:flex;align-items:center;gap:8px}
.gps{background:var(--fill);border:0;border-radius:999px;padding:6px 11px;font-size:13px;display:flex;gap:6px;align-items:center;min-height:36px}
.live{background:var(--ok);color:#fff;border-radius:8px;padding:0 5px;font-size:11px}
.dot{width:9px;height:9px;border-radius:50%;background:#B5BEB8;display:inline-block}
.dot.ok{background:#3FA567}.dot.warn{background:#E0A63A}.dot.bad{background:#E5534B}
.main{flex:1 1 auto;overflow-y:auto;-webkit-overflow-scrolling:touch;padding-bottom:20px}
.tabbar{flex:0 0 auto;display:flex;background:#fff;border-top:1px solid var(--line);padding-bottom:var(--sab)}
.tabbar button{flex:1;border:0;background:transparent;padding:8px 0 6px;font-size:11px;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:3px;min-height:54px}
.tabbar .ic svg{width:23px;height:23px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;display:block}
.tabbar button[aria-selected=true]{color:var(--ink);font-weight:700}
.tabbar button[aria-selected=true] .ic{color:var(--accent)}
.pane{padding:14px calc(14px + var(--sar)) 14px calc(14px + var(--sal))}
.card{background:var(--card);border-radius:18px;padding:16px;margin-bottom:12px;box-shadow:var(--shadow)}
.card h2{font-size:20px;margin-bottom:2px;letter-spacing:-.01em}
.hint{font-size:13px;color:var(--muted);margin-bottom:10px}
.f{margin:0 0 16px}
.f>label,.lbl{display:block;font-weight:600;font-size:13px;color:var(--muted);margin-bottom:6px}
input[type=text],input[type=number],input[type=date],input[type=url],input[type=search],select,textarea{width:100%;border:1.5px solid transparent;border-radius:12px;padding:11px 12px;background:var(--fill);min-height:48px;font-size:16px}
textarea{min-height:84px;resize:vertical}
input:focus,select:focus,textarea:focus{outline:0;border-color:var(--ink);background:#fff}
button:focus-visible{outline:3px solid #F4A261;outline-offset:1px}
.row{display:flex;gap:8px;flex-wrap:wrap}.row>*{flex:1 1 130px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1.5px solid var(--line);background:#fff;border-radius:999px;padding:9px 15px;min-height:42px;font-size:15px}
.chip[aria-pressed=true]{background:var(--ink);border-color:var(--ink);color:#fff;font-weight:600}
.chip.plus{border-style:dashed;color:var(--muted)}
.pickbtn{width:100%;display:flex;justify-content:space-between;align-items:center;gap:8px;text-align:left;border:1.5px solid transparent;background:var(--fill);border-radius:12px;padding:11px 12px;min-height:48px;font-size:16px}
.pickbtn.empty .pv{color:#8B9791}.pickbtn .caret{color:var(--muted)}
.clr{background:transparent;border:0;color:var(--muted);font-size:13px;padding:6px 2px;text-decoration:underline}.clr.bad{color:var(--bad)}
.checks{display:grid;grid-template-columns:1fr 1fr;gap:6px}
@media(max-width:380px){.checks{grid-template-columns:1fr}}
.chk{display:flex;align-items:center;gap:9px;background:var(--fill);border-radius:12px;padding:10px 11px;min-height:46px;font-size:14.5px;line-height:1.25;cursor:pointer}
.chk input{width:20px;height:20px;flex:0 0 auto;accent-color:var(--ink);margin:0}
.chk.on{background:#E5EEE8;font-weight:600}
.btn{border:1.5px solid var(--ink);background:#fff;border-radius:14px;padding:11px 15px;min-height:48px;font-weight:600}
.btn.pri{background:var(--accent);border-color:var(--accent);color:#fff}.btn.dark{background:var(--ink);color:#fff}
.btn.sm{min-height:38px;padding:7px 12px;font-size:14px;border-radius:11px}.btn.danger{border-color:var(--bad);color:var(--bad)}
.btn:disabled{opacity:.4}
.bar{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}.bar>.btn{flex:1 1 150px}
.bar.sticky>.btn{font-size:15px;padding:10px 8px}
.bar.sticky{position:sticky;bottom:0;background:linear-gradient(to top,#fff 80%,rgba(255,255,255,0));padding:14px 0 2px;margin-top:8px;z-index:3}
.tool{background:var(--fill);border-radius:12px;padding:8px;margin-top:8px}
.num{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
.read{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:40px;font-weight:700;line-height:1.05}
.stationbar{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:10px}
.bigcode{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:30px;font-weight:700;line-height:1.05;letter-spacing:-.02em}
.bigcode.small{font-size:22px}
.stationbar .bar{flex-wrap:nowrap}.stationbar .bar>.btn{flex:1 1 auto;min-width:0;padding:7px 11px}
.stepper{display:flex;gap:4px;overflow-x:auto;padding:2px 0 12px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.stepper::-webkit-scrollbar{display:none}
.step{flex:0 0 auto;display:flex;align-items:center;gap:7px;border:0;background:transparent;border-radius:999px;padding:8px 12px 8px 8px;font-size:14px;white-space:nowrap;min-height:40px;color:var(--muted)}
.step .sn{width:22px;height:22px;border-radius:50%;background:#E3E8E1;font-size:12px;display:flex;align-items:center;justify-content:center;font-weight:700;color:var(--ink)}
.step.done .sn{background:var(--ok);color:#fff}
.step.on{background:var(--ink);color:#fff}.step.on .sn{background:var(--accent);color:#fff}
.step i{font-style:normal;font-size:11px;background:rgba(0,0,0,.12);border-radius:9px;padding:0 6px}
.step.dim:not(.on){opacity:.4}.step:disabled{opacity:.35}
.seg{display:flex;background:var(--fill);border-radius:14px;padding:4px;margin-bottom:12px}
.seg button{flex:1;border:0;background:transparent;border-radius:11px;padding:10px 6px;font-weight:600;font-size:14px;color:var(--muted);display:flex;gap:6px;justify-content:center;align-items:center}
.seg button.on{background:#fff;color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.seg i{font-style:normal;font-size:11px;background:var(--ink);color:#fff;border-radius:9px;padding:0 6px}
.sech{font-size:12px;font-weight:700;color:var(--muted);letter-spacing:.04em;margin:18px 0 10px;padding-top:12px;border-top:1px solid var(--line)}
.sech.lone{border-top:0;margin:6px 0 8px;padding-top:0}
.codechip{display:flex;gap:8px;align-items:baseline;background:var(--fill);border-radius:12px;padding:9px 12px;margin-bottom:14px;font-size:13px;color:var(--muted)}
.codechip b{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:17px;color:var(--ink)}
.f.off{opacity:.38;margin-bottom:10px;pointer-events:none}.f.off label{margin:0 0 2px}.offtxt{font-size:12px;color:var(--muted)}
.offnote{background:var(--fill);border-radius:12px;padding:14px;color:var(--muted);font-size:14px;margin-bottom:6px;opacity:.9}
.dimnote{background:#FFF4E5;color:#8A5A12;border-radius:12px;padding:10px 12px;font-size:13px;margin-bottom:10px}
.sec.off{opacity:.38;pointer-events:none}
.ori .orow{display:flex;gap:8px}.ori .orow input{flex:1 1 0;min-width:0}.ori .measure{flex:0 0 auto;min-width:92px}
.entries{margin-bottom:10px}
.erow{display:flex;gap:8px;justify-content:space-between;align-items:flex-start;background:#fff;border-radius:14px;padding:11px 12px;margin-bottom:7px;box-shadow:var(--shadow)}
.erow .em{flex:1;min-width:0}.erow .ec{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px;color:var(--muted)}.erow .et{font-size:14px}
.erow .ea{display:flex;flex-direction:column;align-items:flex-end}
.pitems,.sitems{margin-top:6px}
.pitem{display:flex;gap:10px;background:var(--fill);border-radius:14px;padding:8px;margin-bottom:8px}
.pitem img{width:84px;height:84px;object-fit:cover;border-radius:10px;flex:0 0 auto}
.pitem .pbody{flex:1;min-width:0}.pitem textarea{min-height:56px;margin:4px 0;padding:8px 10px;font-size:14px;background:#fff}
.pitem .lk{display:flex;gap:14px}
.sitem{display:flex;gap:10px;justify-content:space-between;align-items:flex-start;background:var(--fill);border-radius:14px;padding:10px 12px;margin-bottom:8px}
.modal{position:fixed;inset:0;background:rgba(12,20,16,.6);z-index:1000;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--paper);width:100%;max-width:640px;border-radius:22px 22px 0 0;padding:16px calc(16px + var(--sar)) calc(16px + var(--sab)) calc(16px + var(--sal));max-height:92%;overflow:auto}
.sheet.tall{height:90%;display:flex;flex-direction:column}.sheet .scroll{flex:1;overflow-y:auto;margin:10px 0;-webkit-overflow-scrolling:touch}
.sheet.cam{max-width:760px;padding:0;background:#000;color:#fff}
.sheet h2{font-size:19px}.sh-head{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px}
.plist{flex:1;overflow-y:auto;margin:8px 0;-webkit-overflow-scrolling:touch}
.prow{width:100%;display:flex;align-items:center;gap:10px;text-align:left;background:#fff;border:0;border-bottom:1px solid var(--line);padding:13px 10px;min-height:52px;font-size:16px}
.prow .tick{width:22px;color:var(--ok);font-weight:700}.prow .pn{flex:1}.prow .pc{font-family:ui-monospace,Consolas,monospace;font-size:12px;color:var(--muted);background:var(--fill);border-radius:7px;padding:2px 8px}
.prow[aria-pressed=true]{background:#EAF3EC}.prow.add{color:var(--accent);font-weight:700}
.addbox{background:#fff;border-radius:12px;padding:10px}.addbox summary{font-weight:600;padding:4px 0}.addbox input{margin:6px 0}
video{width:100%;max-height:68vh;background:#000;display:block}
.camov{position:absolute;left:8px;top:8px;background:rgba(0,0,0,.6);color:#fff;font-family:ui-monospace,Consolas,monospace;font-size:12px;padding:4px 8px;border-radius:6px}
.toast{position:fixed;left:50%;bottom:calc(76px + var(--sab));transform:translateX(-50%);background:var(--ink);color:#fff;padding:11px 18px;border-radius:999px;z-index:2000;max-width:90vw;font-size:14px;box-shadow:0 6px 18px rgba(0,0,0,.25)}
.toast.bad{background:var(--bad)}
.rec{background:#fff;border-radius:14px;margin-bottom:8px;box-shadow:var(--shadow)}
.rec>button.head{width:100%;text-align:left;background:transparent;border:0;padding:13px;display:flex;gap:10px;align-items:baseline;min-height:50px}
.rec>button.head b{font-family:ui-monospace,Menlo,Consolas,monospace}
.rec .body{padding:0 13px 10px}.subrec{border-top:1px solid var(--line);padding:9px 0}
.rec dl{margin:4px 0 6px;display:grid;grid-template-columns:120px 1fr;gap:3px 8px;font-size:13.5px}
.rec dt{color:var(--muted)}.rec dd{margin:0;word-break:break-word}
.photos{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.ph{background:#fff;border-radius:14px;overflow:hidden;font-size:12px;box-shadow:var(--shadow)}
.ph img{width:100%;height:110px;object-fit:cover;display:block}.ph>div{padding:6px 8px;word-break:break-word}
.dial{width:230px;height:230px;margin:6px auto;display:block}
.warn{color:var(--warn);font-size:13px}
.clist{margin:8px 0}.crow{display:flex;gap:8px;align-items:center;justify-content:space-between;flex-wrap:wrap;border-bottom:1px solid var(--line);padding:9px 0}
.crow .cn{flex:1 1 160px;min-width:0}.crow .cb{display:flex;gap:5px;flex-wrap:wrap}
.pc{font-family:ui-monospace,Consolas,monospace;font-size:12px;color:var(--muted);background:var(--fill);border-radius:7px;padding:1px 7px;margin-left:6px}
.mine{font-size:11px;color:#fff;background:var(--ink);border-radius:7px;padding:1px 7px;margin-left:6px}
details.card summary{cursor:pointer}
@media(prefers-reduced-motion:no-preference){.toast{animation:gfpIn .15s ease-out}}
@keyframes gfpIn{from{opacity:0;transform:translate(-50%,8px)}to{opacity:1;transform:translate(-50%,0)}}
</style>

<script>
(function () {
'use strict';
var root = document.getElementById('gfp');

/* ---------- helpers ---------- */
function el(tag, attrs, kids) {
  var n = document.createElement(tag);
  if (attrs) Object.keys(attrs).forEach(function (k) {
    if (k === 'class') n.className = attrs[k];
    else if (k.slice(0, 2) === 'on') n[k] = attrs[k];
    else if (attrs[k] !== undefined && attrs[k] !== null && attrs[k] !== false) n.setAttribute(k, attrs[k]);
  });
  [].concat(kids === undefined ? [] : kids).forEach(function (c) {
    if (c === null || c === undefined || c === false) return;
    n.appendChild(typeof c === 'object' ? c : document.createTextNode(String(c)));
  });
  return n;
}
function pad2(n) { return (n < 10 ? '0' : '') + n; }
function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 7); }
function today() { var d = new Date(); return d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate()); }
function nowStr() { var d = new Date(); return today() + ' ' + pad2(d.getHours()) + ':' + pad2(d.getMinutes()); }
function norm360(x) { return ((x % 360) + 360) % 360; }
function clamp(x, a, b) { return Math.max(a, Math.min(b, x)); }
function toast(msg, bad) {
  var t = el('div', {class: 'toast' + (bad ? ' bad' : ''), role: 'status'}, msg);
  document.body.appendChild(t); setTimeout(function () { if (t.parentNode) t.parentNode.removeChild(t); }, bad ? 4500 : 2200);
}
function download(blob, name) {
  var a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name;
  document.body.appendChild(a); a.click();
  setTimeout(function () { URL.revokeObjectURL(a.href); a.remove(); }, 1500);
}
function safeName(s) { return String(s || 'project').replace(/[^A-Za-z0-9_\-]+/g, '_'); }
function ask(title, label, def, okText) {
  return new Promise(function (res) {
    var inp = el('input', {type: 'text', value: def || '', autocomplete: 'off'});
    var close = function (v) { m.remove(); res(v); };
    var m = el('div', {class: 'modal'}, el('div', {class: 'sheet'}, [el('h2', {}, title), el('div', {class: 'f'}, [el('label', {}, label), inp]),
      el('div', {class: 'bar'}, [el('button', {type: 'button', class: 'btn pri', onclick: function () { close(inp.value.trim() || null); }}, okText || 'OK'),
        el('button', {type: 'button', class: 'btn', onclick: function () { close(null); }}, 'Cancel')])]));
    document.body.appendChild(m); setTimeout(function () { inp.focus(); inp.select(); }, 50);
  });
}

/* ---------- state and storage ---------- */
var LS = 'gfp2_settings', LC = 'gfp2_catalog';
var S = {settings: {geologist: '', decl: 0, stamp: true, project: '', projects: [], flow: {}},
  records: [], photos: [], tab: 'log', fix: null, watch: null, objUrls: {}, catalog: {}, extra: null, edit: null, stationFilter: 'station'};
try { Object.assign(S.settings, JSON.parse(localStorage.getItem(LS) || '{}')); } catch (e) {}
function saveSettings() { try { localStorage.setItem(LS, JSON.stringify(S.settings)); } catch (e) {} }
function saveCatalog() { try { localStorage.setItem(LC, JSON.stringify(S.catalog)); } catch (e) {} }

var db = null;
function openDB() {
  return new Promise(function (res, rej) {
    var rq = indexedDB.open('gfp2_db', 1);
    rq.onupgradeneeded = function () {
      var d = rq.result;
      if (!d.objectStoreNames.contains('records')) d.createObjectStore('records', {keyPath: 'id'});
      if (!d.objectStoreNames.contains('photos')) d.createObjectStore('photos', {keyPath: 'id'});
    };
    rq.onsuccess = function () { res(rq.result); }; rq.onerror = function () { rej(rq.error); };
  });
}
function dbAll(store) { return new Promise(function (res, rej) { var rq = db.transaction(store).objectStore(store).getAll(); rq.onsuccess = function () { res(rq.result); }; rq.onerror = function () { rej(rq.error); }; }); }
function dbPut(store, obj) { return new Promise(function (res, rej) { var tx = db.transaction(store, 'readwrite'); tx.objectStore(store).put(obj); tx.oncomplete = function () { res(); }; tx.onerror = function () { rej(tx.error); }; }); }
function dbDel(store, id) { return new Promise(function (res, rej) { var tx = db.transaction(store, 'readwrite'); tx.objectStore(store).delete(id); tx.oncomplete = function () { res(); }; tx.onerror = function () { rej(tx.error); }; }); }

/* ---------- catalog: every drop down list, editable ---------- */
function L(pairs) { return pairs.map(function (p) { return typeof p === 'string' ? {n: p, c: ''} : {n: p[0], c: p[1] || ''}; }); }
var CATALOG_META = {
  rock: 'Rock type', unit: 'Unit or formation', colour: 'Colour', priority: 'Priority', younging: 'Younging direction', evidence: 'Younging evidence',
  thickness: 'Bed thickness', grain: 'Grain size', fabric: 'Fabric', fabric_sub: 'Banded fabric type', extras: 'Extras in the bed', contact: 'Contact below',
  structtype: 'Structure type', quality: 'Measurement quality', folform: 'Foliation form', closure: 'Fold closure', shape: 'Fold shape', tight: 'Fold tightness',
  asym: 'Fold asymmetry', yesno: 'Yes or no', conf: 'Confidence', kind: 'Thrust, fault, shear zone, contact', seen: 'How well seen', faultrock: 'Fault rock',
  style: 'Deformation style', rep: 'Repetition or omission', fabrics: 'Fabrics seen', phase: 'Deformation phase', indicators: 'Shear sense indicators',
  index: 'Index minerals', mode: 'Mode of mineral', timing: 'Timing against foliation', texture: 'Metamorphic texture', retro: 'Retrogression',
  side: 'Zone boundary side', deposit: 'Deposit type', control: 'Geological control', ore: 'Ore minerals', oxid: 'Oxidation products', gangue: 'Gangue minerals',
  alt: 'Alteration', oretiming: 'Ore timing evidence', old: 'Old working', samplestaken: 'Samples taken at occurrence', isotype: 'Isotope sample type',
  veingen: 'Vein generation', fabricrel: 'Relation to fabric', isoq: 'Isotope question', bodytype: 'Igneous body type', bodyform: 'Likely body form',
  bodycontact: 'Igneous contact', intr: 'Intrusive evidence', tect: 'Tectonic evidence', internal: 'Internal features', deform: 'Deformation level',
  bodysamples: 'Igneous samples', other: 'Other observation type', analyses: 'Analyses planned', objective: 'Thesis objective', weather: 'Weather',
  dailyclose: 'Daily close checklist', photosubject: 'Photo subject'
};
var DEFAULTS = {
  rock: L([['Quartzite', 'Q'], ['Schist', 'Sch'], ['Phyllite', 'Ph'], ['Slate', 'Sl'], ['Marble', 'Mb'], ['Dolomite', 'Dol'], ['Limestone', 'Ls'], ['Gneiss', 'Gn'],
    ['Amphibolite or metabasic rock', 'Am'], ['Granite', 'Gr'], ['Other igneous rock', 'Ig'], ['Ore', 'Ore'], ['Sandstone', 'Ss'], ['Shale', 'Sh'], ['Metasandstone', 'Msst'],
    ['Greenschist', 'Gs'], ['Pegmatite', 'Peg'], ['Quartz vein', 'Qv']]),
  unit: [],
  colour: L(['White', 'Light grey', 'Grey', 'Dark grey', 'Black', 'Green', 'Dark green', 'Brown', 'Red', 'Yellow', 'Pink', 'Blue grey']),
  priority: L([['Essential', 'A'], ['High value', 'B'], ['Optional', 'C']]),
  younging: L([['Younging up', 'Up'], ['Younging down', 'Down'], ['Unknown', 'Unk']]),
  evidence: L(['Graded bedding', 'Cross bedding', 'Ripple marks', 'Load structures', 'Stromatolites']),
  thickness: L([['Very thick (over 1 m)', 'VT'], ['Thick (30 cm to 1 m)', 'T'], ['Medium (10 to 30 cm)', 'M'], ['Thin (under 10 cm)', 'Th']]),
  grain: L([['Very coarse (over 2 mm)', 'VC'], ['Coarse (1 to 2 mm)', 'C'], ['Medium (0.75 to 1 mm)', 'M'], ['Fine (under 0.75 mm)', 'F']]),
  fabric: L(['Massive', 'Banded']),

      Ck('incl', 'Inclusion trails in porphyroblasts', ['None seen', 'Straight', 'Curved', 'Sigmoidal', 'Spiral (helicitic)', 'Rotated']),
